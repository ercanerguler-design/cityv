version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cityv_postgres
    environment:
      POSTGRES_DB: cityv
      POSTGRES_USER: cityv_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityv_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityv_user -d cityv"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityv_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityv_backend
    environment:
      DATABASE_URL: postgresql+psycopg://cityv_user:${POSTGRES_PASSWORD:-cityv_secret}@postgres:5432/cityv
      SECRET_KEY: ${SECRET_KEY:-city-v-super-secret-key-2024}
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityv_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
